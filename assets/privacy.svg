nchor="start" xml:space="preserve">  Claude/claude-code-sessions/</text><text x="19.0" y="168" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5fb3ad" text-anchor="start" xml:space="preserve">  claude_desktop_config.json</text><text x="19.0" y="194" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5fb3ad" text-anchor="start" xml:space="preserve">~/.claude/projects/*/*.jsonl</text><path d="M2.0 255.5H278.6666666666667" stroke="#e8dfd6" stroke-opacity=".10"/><text x="19.0" y="282" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#a08d7c" text-anchor="start">Never writes to the app</text><rect x="302.1666666666667" y="0.5" width="277.6666666666667" height="299" rx="6" fill="#0d0b09" stroke="#e8dfd6" stroke-opacity="0.22" stroke-width="1"/><text x="319.6666666666667" y="26" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#a08d7c" text-anchor="start" letter-spacing="1.40">WRITES</text><text x="532.3333333333334" y="26" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#5fb3ad" text-anchor="end" letter-spacing="2.4">II</text><g transform="translate(544.3333333333334 13) scale(0.2812)" color="#cbbfb2" fill="none" stroke="#cbbfb2" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"><path d="M14 12h36v34a6 6 0 0 1-12 0V22H8a6 6 0 0 0 6 6"/><path d="M22 24h14M22 32h14M22 40h10" stroke-width="2.40"/></g><path d="M302.6666666666667 44.5H579.3333333333334" stroke="#e8dfd6" stroke-opacity=".10"/><text x="319.6666666666667" y="80" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="