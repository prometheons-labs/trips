2" fill="none" stroke="#cbbfb2" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="6"/><path d="M32 8v6M32 50v6M8 32h6M50 32h6" stroke-width="2.40"/></g><path d="M603.3333333333334 44.5H880.0" stroke="#e8dfd6" stroke-opacity=".10"/><text x="620.3333333333334" y="80" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e8dfd6" text-anchor="start">Model calls</text><text x="620.3333333333334" y="116" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#cbbfb2" text-anchor="start" xml:space="preserve">Haiku via $.model.complete</text><text x="620.3333333333334" y="142" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#cbbfb2" text-anchor="start" xml:space="preserve">your own Claude login</text><text x="620.3333333333334" y="168" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#cbbfb2" text-anchor="start" xml:space="preserve">short excerpts only</text><text x="620.3333333333334" y="194" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#cbbfb2" text-anchor="start" xml:space="preserve">at most 1 an hour + closes</text><path d="M603.3333333333334 255.5H880.0" stroke="#e8dfd6" stroke-opacity=".10"/><text x="620.3333333333334" y="282" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#a08d7c" text-anchor="start">Nothing else leaves</text></svg>
